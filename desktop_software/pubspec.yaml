name: desktop_software
description: "Desktop control software for my personal custom motor controller"
publish_to: "none"

version: 2.1.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  
  provider: 6.1.5+1
  window_manager: 0.5.1
  flutter_libserialport: 0.6.0
  libserialport: 0.3.0+1
  logger: 2.6.2
  smooth_scroll_multiplatform: 1.0.8
  resizable_splitter: 1.1.0
  flutter_context_menu: 0.4.2
  ffi: 2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  windows:
    generate: true
    image_path: "assets/icon_256x256.png"
    icon_size: 256
